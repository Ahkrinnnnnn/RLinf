# env defaults for rc09 peg-insert (merged into env.train / env.eval)
env_type: isaaclab
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 360
max_episode_steps: 360

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "Isaac-RC09-PegInsert-Visuomotor-v0"
  num_envs: null
  max_episode_steps: ${..max_episode_steps}
  task_description: "Insert the blue tube into the purple base"  # RC09_SUBTASK=insert_tube
  enable_domain_randomization: true
  save_startup_camera_views: true
  # Isaac AppLauncher: headless=false needs a working DISPLAY (or livestream).
  headless: true
  enable_cameras: true
  table_cam:
    height: 480
    width: 640
  wrist_cam:
    height: 480
    width: 640
