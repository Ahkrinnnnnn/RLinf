# RLT Stage-2: TD3 + BC (paper §IV-B) — Pi0.5 + frozen RL Token (lerobot checkpoint)
#
# Hyperparameters align with lerobot ``lerobot-rlt-stage2`` (utd_ratio, replay_stride, etc.).
# Loss math: ``lerobot.rlt.shared`` / ``rlinf.rlt.RLTTD3Driver``.
# Stage-1 weights: ``use_rl_token`` + ``rl_token_checkpoint`` (lerobot-train output).
# Ray worker ``embodied_rlt_td3`` integration: see ``rlinf/rlt/ROADMAP.md`` Phase 2.
#
# @package _global_
defaults:
  - /rc09_peg_insert/env@env.train
  - /rc09_peg_insert/env@env.eval
  - /model/pi0_5@actor.model
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer/patch_syncer@weight_syncer
  - override /hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rc09_peg_insert_td3_pi05_rlt"
    logger_backends: ["tensorboard"]

  max_epochs: 2000
  max_steps: -1
  only_eval: False
  val_check_interval: 50
  save_interval: 50
  weight_sync_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  # --- RLT Stage-2: TD3 + BC (not PPO / not SAC) ---
  adv_type: embodied_rlt_td3
  loss_type: embodied_rlt_td3
  loss_agg_func: "token-mean"
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level

  # TD3 Bellman + target EMA (paper / lerobot RLTTD3AlgorithmConfig)
  gamma: 0.99
  tau: 0.005                    # critic_target_update_weight
  policy_update_freq: 2         # delayed actor updates
  utd_ratio: 5                  # critic updates per outer step
  grad_clip_norm: 40.0

  # BC regularization (paper Eq. 5)
  bc_weight_max: 1.0
  bc_weight_min: 0.0
  bc_decay_steps: 10000
  warmup_pretraining_updates: 0
  delta_penalty_weight: 0.0
  ref_dropout_prob: 0.5

  # Off-policy replay (async actor-learner)
  replay_buffer:
    enable_cache: True
    cache_size: 50000
    sample_window_size: 50000
    min_buffer_size: 200          # warmup_min_buffer_size
    auto_save: False
  replay_stride: 2                # dense window stride (paper default)
  chunk_return_discount: 0.99

  target_update_freq: 1
  target_update_type: critic
  update_epoch: 50                # learner steps per collect round (train_iters_per_collect)

  # Actor / critic LRs (lerobot defaults)
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  num_critics: 2

  filter_rewards: False

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 32
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    seed: 42
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  recompute_logprobs: False

  model:
    model_path: "../lerobot/outputs/models/pi05_insert_the_blue_tube_all/checkpoints/140000/pretrained_model"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 256
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "../lerobot/outputs/models/pi05_insert_the_blue_tube_all/checkpoints/140000/pretrained_model"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 10       # paper C=10; matches lerobot stage-2 chunk_len
    num_steps: 5
    add_value_head: False       # TD3 uses separate ChunkCriticEnsemble, not PPO value head
    add_q_head: False

    openpi:
      config_name: "pi05_isaaclab_rc09_peg_insert"
      num_images_in_input: 2
      noise_level: 0.0          # TD3 actor has its own fixed_std Gaussian
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      train_expert_only: True   # freeze VLA backbone; train only RLT actor MLP
      detach_critic_input: True
      use_rl_token: True
      rl_token_checkpoint: "../lerobot/outputs/models/rlt_pi05_token_only_insert_the_blue_tube/checkpoints/last/pretrained_model"

  # Lightweight RLT Stage-2 actor (ChunkActor) — owned by RLTTD3Driver, not OpenPI
  rlt_actor:
    chunk_len: ${actor.model.num_action_chunks}
    action_dim: ${actor.model.action_dim}
    token_dim: 2048
    proprio_dim: 7              # rc09 states: eef_pos(3)+axis_angle(3)+gripper(1)
    fixed_std: 0.1
    ref_dropout_prob: ${algorithm.ref_dropout_prob}
    action_representation: "delta_chunk"
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]

  optim:
    lr: ${algorithm.actor_lr}
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: ${algorithm.grad_clip_norm}
    weight_decay: 0.0

  critic_optim:
    lr: ${algorithm.critic_lr}
    clip_grad: ${algorithm.grad_clip_norm}
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
