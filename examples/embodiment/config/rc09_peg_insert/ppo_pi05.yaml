# @package _global_
# PPO RL post-training: LeRobot Pi0.5 checkpoint (no RL Token)
defaults:
  - /rc09_peg_insert/env@env.train
  - /rc09_peg_insert/env@env.eval
  - /model/pi0_5@actor.model
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer/patch_syncer@weight_syncer
  - override /hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rc09_peg_insert_ppo_pi05"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  # Disable checkpoint writes (save_interval > 0 enables save).
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 128
    # 12s episode @ 60Hz sim, decimation=2 -> 360 env steps (match env_cfg)
    max_episode_steps: 360
    max_steps_per_rollout_epoch: 360
    use_fixed_reset_state_ids: True
    seed: 42
  eval:
    rollout_epoch: 1
    total_num_envs: 32
    max_episode_steps: 360
    max_steps_per_rollout_epoch: 360
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "../lerobot/outputs/models/pi05_insert_the_blue_tube/140000/pretrained_model"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: False
  model:
    model_path: "../lerobot/outputs/models/pi05_insert_the_blue_tube/140000/pretrained_model"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_isaaclab_rc09_peg_insert"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
      # --- freezing (see README) ---
      train_expert_only: False
      use_rl_token: False
      rl_token_checkpoint: null
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
