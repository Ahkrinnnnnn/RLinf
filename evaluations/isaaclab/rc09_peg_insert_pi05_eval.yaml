# Frozen-policy rollout eval for RC09 peg-insert (no actor / no training).
# Entry: evaluations/eval_embodied_agent.py + EmbodiedEvalRunner
defaults:
  - /rc09_peg_insert/env@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rc09_peg_insert_pi05_eval_with_insert_the_blue_tube_model"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 5
    total_num_envs: 1
    init_params:
      enable_domain_randomization: false
      headless: true
      enable_cameras: true
    # 12s episode @ 60Hz sim, decimation=2 -> 360 env steps
    max_episode_steps: 360
    max_steps_per_rollout_epoch: 360
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: False
    use_fixed_reset_state_ids: True
    is_eval: True
    seed: 42
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 50
    top_p: 1.0

  model:
    model_path: "../lerobot/outputs/models/pi05_insert_the_blue_tube/140000/pretrained_model"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    openpi:
      config_name: "pi05_isaaclab_rc09_peg_insert"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${rollout.model.num_steps}
      train_expert_only: False
      use_rl_token: False
      rl_token_checkpoint: null

